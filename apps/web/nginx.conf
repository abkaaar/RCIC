server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /health {
    proxy_pass http://server:1234/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /rooms {
    proxy_pass http://server:1234/rooms;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /yjs/ {
    proxy_pass http://server:1234/yjs/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
  }

  location = /yjs {
    proxy_pass http://server:1234/yjs;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
  }
}
